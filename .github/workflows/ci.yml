name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/kasama?schema=public"
      AUTH_SECRET: "ci-not-a-real-secret-32-characters"
      AUTH_GOOGLE_ID: "ci-google-client-id"
      AUTH_GOOGLE_SECRET: "ci-google-client-secret"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_FROM: "ci@example.com"
      DEV_EMAIL: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook browser tests
        run: pnpm test:browser -- --testTimeout=60000

      - name: Build
        run: pnpm build
